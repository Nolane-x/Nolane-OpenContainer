name: Bootstrap Vite C1 exact dependency lock

on:
  push:
    branches: [main]
    paths:
      - toolchain/bootstrap/PIN_VITE_C1_8_3_0

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Pin exact Vite C1 roots
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --ignore-scripts \
            vite@8.3.0 \
            rolldown@1.2.9 \
            'lightningcss@npm:lightningcss-wasm@1.33.0'
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'

          const lockBytes = await readFile('package-lock.json')
          const lock = JSON.parse(lockBytes)
          const roots = lock.packages['']?.devDependencies ?? {}
          const selectedNames = [
            'vite',
            'rolldown',
            'lightningcss',
            '@rolldown/pluginutils',
            '@oxc-project/runtime',
            '@oxc-project/types',
            'picocolors',
            'postcss',
            'tinyglobby'
          ]
          const selected = {}
          for (const name of selectedNames) {
            const path = 'node_modules/' + name
            const meta = lock.packages[path]
            if (!meta) continue
            selected[name] = {
              version: meta.version,
              resolved: meta.resolved,
              integrity: meta.integrity,
              dependencies: meta.dependencies ?? {},
              optionalDependencies: meta.optionalDependencies ?? {}
            }
          }
          const receipt = {
            schemaVersion: 1,
            status: 'LOCKED',
            observedAt: new Date().toISOString(),
            roots: {
              vite: roots.vite,
              rolldown: roots.rolldown,
              lightningcss: roots.lightningcss
            },
            selected,
            packageLockSha256: createHash('sha256').update(lockBytes).digest('hex')
          }
          await writeFile('toolchain/artifacts/vite-c1-runtime-8.3.0.json', JSON.stringify(receipt, null, 2) + '\n')
          console.log(JSON.stringify(receipt, null, 2))
          NODE
      - name: Commit lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "opencontainer-artifact-bot"
          git config user.email "opencontainer-artifact-bot@users.noreply.github.com"
          git add package.json package-lock.json toolchain/artifacts/vite-c1-runtime-8.3.0.json
          git diff --cached --exit-code && exit 0
          git commit -m "build: pin exact Vite 8.3.0 C1 dependency closure"
          git push origin HEAD:main
