name: Adjacent Release Evidence

on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Previous exact published npm version
        required: true
        type: string
      current_version:
        description: Current exact published npm version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: adjacent-release-evidence-${{ inputs.previous_version }}-${{ inputs.current_version }}
  cancel-in-progress: false

jobs:
  adjacent-release:
    if: github.repository == 'Nolane-x/Nolane-OpenContainer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: bash scripts/install-frozen-ci-chrome.sh
      - name: Run actual adjacent published-release court
        run: >-
          npm run adjacent:release:evidence --
          --previous=${{ inputs.previous_version }}
          --current=${{ inputs.current_version }}
      - name: Archive adjacent release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-adjacent-release-${{ inputs.previous_version }}-${{ inputs.current_version }}-${{ github.run_id }}
          path: .artifacts/adjacent-release/receipt.json
          if-no-files-found: warn
          retention-days: 90
