name: Bootstrap exact Lightning CSS artifact

on:
  push:
    branches: [main]
    paths:
      - toolchain/bootstrap/ACQUIRE_LIGHTNINGCSS_1_33_0

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org

      - name: Acquire exact npm tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-lightningcss
          mkdir -p .tmp-lightningcss toolchain/vendor toolchain/artifacts
          cd .tmp-lightningcss
          FILE="$(npm pack lightningcss-wasm@1.33.0 --silent)"
          test -f "$FILE"
          echo "266866c1b0efd7ca5307fe312411e4f1895b997086fb76f392ec5b60aadf31c8  $FILE" | sha256sum -c -
          mv "$FILE" ../toolchain/vendor/lightningcss-wasm-1.33.0.tgz
          cd ..
          tar -xzf toolchain/vendor/lightningcss-wasm-1.33.0.tgz -C .tmp-lightningcss

      - name: Compile and record WASM shape
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'

          const tarball = await readFile('toolchain/vendor/lightningcss-wasm-1.33.0.tgz')
          const wasm = await readFile('.tmp-lightningcss/package/lightningcss_node.wasm')
          const module = await WebAssembly.compile(wasm)
          const imports = WebAssembly.Module.imports(module)
          const exports = WebAssembly.Module.exports(module)
          const namespaces = {}
          for (const entry of imports) namespaces[entry.module] = (namespaces[entry.module] ?? 0) + 1

          const receipt = {
            schemaVersion: 1,
            status: 'PASS-LOCAL-RETAINED',
            observedAt: new Date().toISOString(),
            package: 'lightningcss-wasm',
            version: '1.33.0',
            tarball: {
              file: 'toolchain/vendor/lightningcss-wasm-1.33.0.tgz',
              bytes: tarball.byteLength,
              sha256: createHash('sha256').update(tarball).digest('hex')
            },
            wasm: {
              pathInTarball: 'package/lightningcss_node.wasm',
              bytes: wasm.byteLength,
              sha256: createHash('sha256').update(wasm).digest('hex'),
              imports: imports.length,
              exports: exports.length,
              importNamespaces: namespaces,
              compile: 'PASS'
            },
            boundary: {
              browserExecution: 'OPEN',
              viteC1: 'OPEN'
            }
          }
          await writeFile('toolchain/artifacts/lightningcss-wasm-1.33.0.json', JSON.stringify(receipt, null, 2) + '\n')
          console.log(JSON.stringify(receipt, null, 2))
          NODE

      - name: Commit retained artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "opencontainer-artifact-bot"
          git config user.email "opencontainer-artifact-bot@users.noreply.github.com"
          git add toolchain/vendor/lightningcss-wasm-1.33.0.tgz toolchain/artifacts/lightningcss-wasm-1.33.0.json
          git diff --cached --exit-code && exit 0
          git commit -m "build: retain exact Lightning CSS 1.33.0 artifact"
          git push origin HEAD:main
