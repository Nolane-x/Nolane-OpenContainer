name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node --version
      - run: npm --version
      - run: npm run ci
      - name: Archive product scope contract receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-product-scope-contract-${{ github.sha }}
          path: .artifacts/product-scope/contract-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-evidence-${{ github.sha }}
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 90
      - name: Archive release preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-preflight-${{ github.sha }}
          path: .artifacts/release-preflight/
          if-no-files-found: error
          retention-days: 90
      - name: Archive critical contract flake receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-critical-contract-flake-${{ github.sha }}
          path: .artifacts/critical-flake/contract-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive P18 contract assurance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-evidence-assurance-contract-${{ github.sha }}
          path: .artifacts/evidence-assurance/contract/
          if-no-files-found: error
          retention-days: 90
      - name: Archive P12 security review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-product-security-${{ github.sha }}
          path: .artifacts/security-review/
          if-no-files-found: error
          retention-days: 90

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript/TypeScript
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"

  browser-product-path:
    needs: [contract, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: |
          google-chrome-stable --version || google-chrome --version || chromium --version
      - run: npm run browser:profile:verify
      - run: npm run critical:browser-flake
      - run: npm run evidence:assure:browser
      - name: Archive product scope browser receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-product-scope-browser-${{ github.sha }}
          path: .artifacts/product-scope/browser-profile-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive critical browser flake receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-critical-browser-flake-${{ github.sha }}
          path: .artifacts/critical-flake/browser-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive P18 browser assurance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-evidence-assurance-browser-${{ github.sha }}
          path: .artifacts/evidence-assurance/browser/
          if-no-files-found: error
          retention-days: 90
