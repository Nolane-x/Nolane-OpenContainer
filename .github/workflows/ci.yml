        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: test "$(npm --version)" = "11.19.0"
      - name: Run real frozen Vitest compatibility court
        run: npm run p6:vitest:evidence
      - name: Archive P6 Vitest receipt
