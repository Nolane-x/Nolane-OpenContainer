name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node --version
      - run: npm --version
      - run: npm run ci
      - name: Archive product scope contract receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-product-scope-contract-${{ github.sha }}
          path: .artifacts/product-scope/contract-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-evidence-${{ github.sha }}
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 90
      - name: Archive P13 supply-chain review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-supply-chain-review-${{ github.sha }}
          path: .artifacts/supply-chain-review/
          if-no-files-found: error
          retention-days: 90
      - name: Archive release preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-preflight-${{ github.sha }}
          path: .artifacts/release-preflight/
          if-no-files-found: error
          retention-days: 90
      - name: Archive critical contract flake receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-critical-contract-flake-${{ github.sha }}
          path: .artifacts/critical-flake/contract-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive P18 contract assurance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-evidence-assurance-contract-${{ github.sha }}
          path: .artifacts/evidence-assurance/contract/
          if-no-files-found: error
          retention-days: 90
      - name: Archive P7 retained-resource audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-p7-resource-retention-${{ github.sha }}
          path: .artifacts/resource-retention/contract-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive P3 persistence source audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-p3-persistence-audit-${{ github.sha }}
          path: .artifacts/p3-persistence/source-audit.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive P12 security review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-product-security-${{ github.sha }}
          path: .artifacts/security-review/
          if-no-files-found: error
          retention-days: 90
      - name: Archive P17 operations drill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-operations-${{ github.sha }}
          path: .artifacts/operations/
          if-no-files-found: error
          retention-days: 90
      - name: Archive release compatibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-compatibility-${{ github.sha }}
          path: .artifacts/compatibility/
          if-no-files-found: error
          retention-days: 90

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript/TypeScript
        id: codeql-analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
          output: .artifacts/codeql
      - name: Verify CodeQL SARIF severity and waivers
        run: node scripts/security-codeql-receipt.mjs .artifacts/codeql
      - name: Archive CodeQL SARIF and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-codeql-${{ github.sha }}
          path: |
            .artifacts/codeql/
            .artifacts/security-review/codeql-receipt.json
          if-no-files-found: error
          retention-days: 90






  p6-vitest-real-execution:
    needs: [contract, codeql, p6-toolchain-vite]
    runs-on: ubuntu-latest
