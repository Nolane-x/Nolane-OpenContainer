name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node --version
      - run: npm --version
      - run: npm run ci
      - name: Archive release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-evidence-${{ github.sha }}
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 90
      - name: Archive release preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-release-preflight-${{ github.sha }}
          path: .artifacts/release-preflight/
          if-no-files-found: error
          retention-days: 90
      - name: Archive critical contract flake receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-critical-contract-flake-${{ github.sha }}
          path: .artifacts/critical-flake/contract-receipt.json
          if-no-files-found: error
          retention-days: 90

  browser-product-path:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: |
          google-chrome-stable --version || google-chrome --version || chromium --version
      - run: npm run critical:browser-flake
      - name: Archive critical browser flake receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencontainer-critical-browser-flake-${{ github.sha }}
          path: .artifacts/critical-flake/browser-receipt.json
          if-no-files-found: error
          retention-days: 90
