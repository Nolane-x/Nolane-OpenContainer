  p3-native-external-permission:
    needs: [contract, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Install native picker automation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xvfb openbox scrot
      - run: bash scripts/install-frozen-ci-chrome.sh
      - run: |
          google-chrome-stable --version || google-chrome --version || chromium --version
          dpkg-query -W -f='xdotool ${Version}\n' xdotool
          dpkg-query -W -f='openbox ${Version}\n' openbox
      - name: Run real showDirectoryPicker permission court
        run: xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & npm run p3:native-external:evidence'
      - name: Archive P3 native external permission receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
