name: Bootstrap exact Rolldown browser artifact

on:
  push:
    branches: [main]
    paths:
      - toolchain/bootstrap/ACQUIRE_ROLLDOWN_BROWSER_1_2_9

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org

      - name: Acquire npm package and prove dist equals official release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rolldown-browser
          mkdir -p .tmp-rolldown-browser toolchain/vendor toolchain/artifacts
          cd .tmp-rolldown-browser
          FILE="$(npm pack @rolldown/browser@1.2.9 --silent)"
          test -f "$FILE"
          tar -xzf "$FILE"
          test "$(node -p "require('./package/package.json').name")" = "@rolldown/browser"
          test "$(node -p "require('./package/package.json').version")" = "1.2.9"
          cd package/dist
          find . -type f -print0 | sort -z | while IFS= read -r -d '' f; do
            sha256sum "$f" | sed 's#  \./#  #'
          done > ../../dist.manifest.txt
          cd ../..
          MANIFEST_SHA="$(sha256sum dist.manifest.txt | awk '{print $1}')"
          test "$MANIFEST_SHA" = "75492b477ad45162d0f92543ddb3fb0ae9b3a727ff652ef251b8532cb53f1308"
          test "$(wc -l < dist.manifest.txt | tr -d ' ')" = "63"
          echo "629aa10c37a9920cd5729a35af148983c881f4ff9edd6368a7d63b5acbf89dc2  package/dist/rolldown-binding.wasm32-wasi.wasm" | sha256sum -c -
          mv "$FILE" ../toolchain/vendor/rolldown-browser-1.2.9.tgz
          cd ..

      - name: Record retained package receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'

          const tarball = await readFile('toolchain/vendor/rolldown-browser-1.2.9.tgz')
          const pkg = JSON.parse(await readFile('.tmp-rolldown-browser/package/package.json', 'utf8'))
          const receipt = {
            schemaVersion: 1,
            status: 'PASS-OFFICIAL-DIST-CONCORDANCE',
            observedAt: new Date().toISOString(),
            package: '@rolldown/browser',
            version: '1.2.9',
            npmTarball: {
              file: 'toolchain/vendor/rolldown-browser-1.2.9.tgz',
              bytes: tarball.byteLength,
              sha256: createHash('sha256').update(tarball).digest('hex')
            },
            officialGithubArtifact: {
              artifactId: 10447416443,
              artifactZipSha256: '44ab2d4a313065c8fb448433877a4a50628aca0a4a972a6f11660ca8f5002ac7',
              fileCount: 63,
              normalizedDistManifestSha256: '75492b477ad45162d0f92543ddb3fb0ae9b3a727ff652ef251b8532cb53f1308'
            },
            keyFiles: {
              'dist/index.browser.mjs': '3738a5cb942733b5fb9bbacdc5502e060a3e48f5edc86378531dc502ed53f9ed',
              'dist/rolldown-binding.wasi-browser.js': '4970cc8275950b4a6a7bc16803a48f0462c5ccad02e65f568d2300662e40fd84',
              'dist/rolldown-binding.wasi.cjs': '5f4ad0a90dd97b1e5d96517c31068575a6e7b6163a54172a8d39b9753d2b2457',
              'dist/rolldown-binding.wasm32-wasi.wasm': '629aa10c37a9920cd5729a35af148983c881f4ff9edd6368a7d63b5acbf89dc2',
              'dist/wasi-worker-browser.mjs': 'c75b826181d93cfa9df7a5e5212a353ad965be363149db634478c618196fe30c'
            },
            dependencies: pkg.dependencies,
            boundary: {
              dependencyRetention: 'OPEN',
              browserExecution: 'OPEN',
              viteC1: 'OPEN'
            }
          }
          await writeFile('toolchain/artifacts/rolldown-browser-1.2.9.json', JSON.stringify(receipt, null, 2) + '\n')
          console.log(JSON.stringify(receipt, null, 2))
          NODE

      - name: Commit retained artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "opencontainer-artifact-bot"
          git config user.email "opencontainer-artifact-bot@users.noreply.github.com"
          git add toolchain/vendor/rolldown-browser-1.2.9.tgz toolchain/artifacts/rolldown-browser-1.2.9.json
          git diff --cached --exit-code && exit 0
          git commit -m "build: retain exact Rolldown browser 1.2.9 artifact"
          git push origin HEAD:main
