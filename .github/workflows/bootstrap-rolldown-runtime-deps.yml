name: Bootstrap Rolldown runtime dependency lock

on:
  push:
    branches: [main]
    paths:
      - toolchain/bootstrap/PIN_ROLLDOWN_RUNTIME_DEPS_1_2_9

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Pin exact runtime dependency roots
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --ignore-scripts \
            @emnapi/core@2.0.0-alpha.5 \
            @emnapi/runtime@2.0.0-alpha.5 \
            @napi-rs/wasm-runtime@1.2.4
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'))
          const selected = {}
          for (const [path, meta] of Object.entries(lock.packages ?? {})) {
            if (!path.includes('node_modules/')) continue
            if (!/@emnapi|@napi-rs|@tybys|tslib/.test(path)) continue
            selected[path] = {
              version: meta.version,
              integrity: meta.integrity,
              dependencies: meta.dependencies ?? {},
              peerDependencies: meta.peerDependencies ?? {}
            }
          }
          const receipt = {
            schemaVersion: 1,
            status: 'LOCKED',
            observedAt: new Date().toISOString(),
            roots: {
              '@emnapi/core': '2.0.0-alpha.5',
              '@emnapi/runtime': '2.0.0-alpha.5',
              '@napi-rs/wasm-runtime': '1.2.4'
            },
            selected,
            packageLockSha256: createHash('sha256').update(await readFile('package-lock.json')).digest('hex')
          }
          await writeFile('toolchain/artifacts/rolldown-runtime-deps-1.2.9.json', JSON.stringify(receipt, null, 2) + '\n')
          console.log(JSON.stringify(receipt, null, 2))
          NODE
      - name: Commit lock
        run: |
          set -euo pipefail
          git config user.name "opencontainer-artifact-bot"
          git config user.email "opencontainer-artifact-bot@users.noreply.github.com"
          git add package.json package-lock.json toolchain/artifacts/rolldown-runtime-deps-1.2.9.json
          git diff --cached --exit-code && exit 0
          git commit -m "build: pin Rolldown WASI runtime dependency closure"
          git push origin HEAD:main
