name: OpenContainer reproducible bug report
description: Report a runtime/package/browser problem using reproducible receipts without pasting secrets.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Run `opencontainer-diagnostic` and attach the JSON receipt when possible.
        Do not paste API keys, cookies, authorization headers, AI prompts/transcripts, private source files, workspace contents, or raw package artifacts.
  - type: input
    id: version
    attributes:
      label: OpenContainer version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Failure fingerprint
      description: The `ocfp:...` value from the support bundle/local diagnostic receipt.
      placeholder: ocfp:0123456789abcdef
  - type: textarea
    id: receipt
    attributes:
      label: Privacy-minimized diagnostic receipt
      description: Paste the JSON receipt generated by opencontainer-diagnostic or supportBundle(). Verify it contains no data you do not want to share.
      render: json
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Give steps and public/synthetic code only. Do not paste private project files or secrets.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment class
      options:
        - CI / headless
        - Chromium desktop
        - Firefox desktop
        - Safari desktop
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked the report and removed secrets, tokens, cookies, private source, workspace contents, HTTP bodies, and AI prompts/transcripts.
          required: true
